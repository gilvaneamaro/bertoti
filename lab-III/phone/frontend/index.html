<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhoneNow</title>
  <!-- Adicionando Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>
<h1>Aparelhos cadastrados</h1>

<div id="cadastro_id">
  <div>
    <label>Modelo</label>
    <input id="entry_modelo">
  </div>

  <div>
    <label for="select_marcas">Marca</label>
    <select name="Marca" id="entry_marca">
      <option value="APPLE">Apple</option>
      <option value="SAMSUNG">Samsung</option>
      <option value="XIAOMI">Xiaomi</option>
      <option value="MOTOROLA">Motorola</option>
    </select>
  </div>

  <div>
    <label>Descrição</label>
    <input id="entry_descricao">
    <button id = "btn" onclick="sendData()">Cadastrar</button>
  </div>
</div>


<div id="botoes_id">
  <button id="loadBtn" onclick="fetchData()">Atualizar lista</button>
</div>

<div class="table-container">
  <table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Modelo</th>
            <th>Marca</th>
            <th>Descrição</th>
            <th id="acoes_id">Ações</th>
  
        </tr>
    </thead>
    <tbody id="id_tbody">
  
    </tbody>
  </table>
</div>



<!-- Adicionando Bootstrap JS (opcional, se você precisar de funcionalidades como dropdowns) -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</html>
